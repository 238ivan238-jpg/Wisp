plugins { id 'com.android.application' }

android {
    namespace 'app.wisp.voice'
    compileSdk 35
    defaultConfig {
        applicationId 'app.wisp.voice'
        minSdk 28
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        debug { storeFile file("${rootDir}/.local/debug.keystore") }
    }
    buildTypes {
        release {
            // Local personal-use certificate; retain .local/debug.keystore for future updates.
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            def testHome = file("${rootDir}/.local/test-home")
            testHome.mkdirs()
            systemProperty 'user.home', testHome.absolutePath
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','javax.net.ssl.trustStore'].each { key ->
                if (System.getProperty(key)) systemProperty key, System.getProperty(key)
            }
        }
    }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
